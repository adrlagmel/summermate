<!DOCTYPE html>
<!-- valoraciones/negocio.html: crear o editar la valoración de una reserva (antes valoracionNegocio/edit.jsp) -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="#{valoracionNegocio.create}">Valorar negocio</title>
</head>
<body>
<div layout:fragment="contenido" class="row justify-content-center">
	<div class="col-lg-7">
		<h1 class="mb-1" th:text="#{valoracionNegocio.create}">Valorar negocio</h1>
		<p class="text-body-secondary"
			th:text="|${form.reserva.negocio.nombre} · ${#temporals.format(form.reserva.fecha, 'dd/MM/yyyy HH:mm')}|">Negocio · fecha</p>
		<form th:action="${form.id == 0} ? @{/mis/reservas/{id}/valoracion(id=${form.reserva.id})} : @{/mis/valoraciones/negocios/{id}(id=${form.id})}"
			th:object="${form}" method="post" novalidate>
			<input th:if="${form.id != 0}" type="hidden" name="_method" value="put">
			<input type="hidden" th:field="*{version}">
			<div th:replace="~{fragments/ui :: campo('titulo', #{valoracionNegocio.titulo}, 'text')}"></div>
			<div th:replace="~{fragments/ui :: area('comentario', #{valoracionNegocio.comentario})}"></div>
			<div th:replace="~{fragments/ui :: puntuacion(#{valoracionNegocio.puntuacion})}"></div>
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary" th:text="#{valoracionNegocio.save}">Guardar</button>
				<a class="btn btn-outline-secondary" th:href="@{/mis/valoraciones/negocios}" th:text="#{valoracionNegocio.atras}">Atrás</a>
			</div>
		</form>
	</div>
</div>
</body>
</html>
