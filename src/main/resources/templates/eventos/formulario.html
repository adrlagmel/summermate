<!DOCTYPE html>
<!-- eventos/formulario.html: alta y edición de un evento (antes evento/edit.jsp) -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="${form.id == 0} ? #{evento.create} : #{evento.edit}">Evento</title>
</head>
<body>
<div layout:fragment="contenido" class="row justify-content-center">
	<div class="col-lg-8">
		<h1 class="mb-4" th:text="${form.id == 0} ? #{evento.create} : #{evento.edit}">Evento</h1>
		<form th:action="${form.id == 0} ? @{/empresario/eventos} : @{/empresario/eventos/{id}(id=${form.id})}" th:object="${form}" method="post" novalidate>
			<input th:if="${form.id != 0}" type="hidden" name="_method" value="put">
			<input type="hidden" th:field="*{version}">
			<div th:replace="~{fragments/ui :: campo('nombre', #{evento.nombre}, 'text')}"></div>
			<div th:replace="~{fragments/ui :: area('descripcion', #{evento.descripcion})}"></div>
			<div class="row">
				<div class="col-md-6" th:insert="~{fragments/ui :: campo('fechaCelebracion', #{evento.fechaCelebracion}, 'datetime-local')}"></div>
				<div class="col-md-6" th:insert="~{fragments/ui :: campo('precio', #{evento.precio}, 'number')}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label" for="negocio" th:text="#{evento.negocio}">Negocio</label>
				<select class="form-select" th:field="*{negocio}" th:classappend="${#fields.hasErrors('negocio')} ? 'is-invalid'">
					<option th:each="n : ${negocios}" th:value="${n.id}" th:text="${n.nombre}">Negocio</option>
				</select>
				<div class="invalid-feedback" th:errors="*{negocio}">Error</div>
			</div>
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary" th:text="#{evento.save}">Guardar</button>
				<a class="btn btn-outline-secondary" th:href="@{/empresario/eventos}" th:text="#{evento.cancel}">Cancelar</a>
			</div>
		</form>
	</div>
</div>
</body>
</html>
