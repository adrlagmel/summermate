<!DOCTYPE html>
<!--
  empresario/pasarela.html: página de la pasarela de pago SIMULADA (Fase 6).
  Con una pasarela real (Stripe Checkout) el empresario iría a la página del
  proveedor y el pago se confirmaría por webhook.
-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="#{premium.pasarela}">Pago</title>
</head>
<body>
<div layout:fragment="contenido" class="row justify-content-center">
	<div class="col-md-7 col-lg-5">
		<div class="card">
			<div class="card-body">
				<p class="badge text-bg-warning" th:text="#{premium.simulada}">Pasarela simulada: no se cobra nada</p>
				<h1 class="h4" th:text="#{premium.pasarela}">Pago</h1>
				<dl class="row mb-3">
					<dt class="col-5" th:text="#{premium.plan}">Plan</dt>
					<dd class="col-7" th:text="#{|premium.plan.${pago.plan}|}">Mensual</dd>
					<dt class="col-5" th:text="#{premium.importe}">Importe</dt>
					<dd class="col-7 puntuacion" th:text="|${#numbers.formatDecimal(pago.importe, 1, 2)} €|">9,99 €</dd>
					<dt class="col-5" th:text="#{premium.referencia}">Referencia</dt>
					<dd class="col-7 font-monospace small text-break" th:text="${pago.referencia}">ref</dd>
				</dl>
				<th:block th:if="${pago.estado.name() == 'PENDIENTE'}">
					<div class="d-flex gap-2">
						<form th:action="@{/empresario/premium/pagos/{r}(r=${pago.referencia})}" method="post">
							<button type="submit" class="btn btn-success" th:text="#{premium.pagar}">Pagar</button>
						</form>
						<form th:replace="~{fragments/ui :: boton(@{/empresario/premium/pagos/{r}(r=${pago.referencia})}, 'delete', #{premium.cancelarPago}, 'btn-outline-secondary', null)}"></form>
					</div>
				</th:block>
				<p th:unless="${pago.estado.name() == 'PENDIENTE'}" th:text="#{|premium.estado.${pago.estado}|}">Pagado</p>
			</div>
		</div>
	</div>
</div>
</body>
</html>
