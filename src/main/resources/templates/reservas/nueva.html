<!DOCTYPE html>
<!-- reservas/nueva.html: reservar en un negocio (antes booking/edit.jsp) -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="#{booking.create}">Reservar</title>
</head>
<body>
<div layout:fragment="contenido" class="row justify-content-center">
	<div class="col-lg-7">
		<h1 class="mb-1" th:text="#{booking.create}">Reservar</h1>
		<p class="text-body-secondary" th:text="|${form.negocio.nombre} · #{negocio.aforo}: ${form.negocio.aforo}|">Negocio</p>
		<div th:if="${libres != null}" class="alert alert-warning" th:text="|#{booking.seats}: ${libres}|">Plazas libres</div>

		<form th:action="@{/negocios/{id}/reservas(id=${form.negocio.id})}" th:object="${form}" method="post" novalidate>
			<div class="row">
				<div class="col-md-7" th:insert="~{fragments/ui :: campo('fecha', #{booking.bookingDate}, 'datetime-local')}"></div>
				<div class="col-md-5" th:insert="~{fragments/ui :: campo('comensales', #{booking.comensales}, 'number')}"></div>
			</div>
			<div class="form-text mb-3" th:text="#{fase5.reserva.horario}">De 12:00 a 24:00. Cada reserva ocupa una hora.</div>
			<div class="form-check form-switch mb-3">
				<input class="form-check-input" type="checkbox" role="switch" th:field="*{fumadores}">
				<label class="form-check-label" th:for="${#ids.prev('fumadores')}" th:text="#{booking.fumadores}">Fumadores</label>
			</div>
			<div th:replace="~{fragments/ui :: area('comentarios', #{booking.comments})}"></div>
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary" th:text="#{booking.reservar}">Reservar</button>
				<a class="btn btn-outline-secondary" th:href="@{/negocios/{id}(id=${form.negocio.id})}" th:text="#{booking.cancel}">Cancelar</a>
			</div>
		</form>
	</div>
</div>
</body>
</html>
