# Integración continua (Fase 7): en cada push y pull request compila, pasa
# todos los tests (Testcontainers usa el Docker del runner) y comprueba que la
# imagen de Docker se construye.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar y pasar los tests
        run: mvn -B -ntp verify

      - name: Informes de los tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: target/surefire-reports/
          retention-days: 7

  imagen:
    name: Imagen de Docker
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: summermate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
