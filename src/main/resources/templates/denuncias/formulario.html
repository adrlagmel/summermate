<!DOCTYPE html>
<!-- denuncias/formulario.html: denunciar una valoración o editar la denuncia (antes denunciaValoracion/edit.jsp) -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="#{denunciaValoracion.create}">Denunciar</title>
</head>
<body>
<div layout:fragment="contenido" class="row justify-content-center">
	<div class="col-lg-7">
		<h1 class="mb-1" th:text="#{denunciaValoracion.create}">Denunciar</h1>
		<blockquote class="border-start border-3 ps-3 my-3 text-body-secondary">
			<p class="fw-semibold mb-1" th:text="${form.valoracionNegocio.titulo}">Título</p>
			<p class="mb-0" th:text="${form.valoracionNegocio.comentario}">Comentario</p>
		</blockquote>
		<form th:action="${form.id == 0} ? @{/empresario/valoraciones/{id}/denuncias(id=${form.valoracionNegocio.id})} : @{/empresario/denuncias/{id}(id=${form.id})}"
			th:object="${form}" method="post" novalidate>
			<input th:if="${form.id != 0}" type="hidden" name="_method" value="put">
			<input type="hidden" th:field="*{version}">
			<div th:replace="~{fragments/ui :: campo('titulo', #{denunciaValoracion.titulo}, 'text')}"></div>
			<div class="mb-3">
				<label class="form-label" for="tipo" th:text="#{denunciaValoracion.tipo}">Tipo</label>
				<select class="form-select" th:field="*{tipo}" th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
					<option th:each="t : ${tipos}" th:value="${t}" th:text="${t.name() == 'FALSEDAD'} ? #{denunciaValoracion.falso} : (${t.name() == 'BURLA'} ? #{denunciaValoracion.burla} : #{denunciaValoracion.rechazo})">Tipo</option>
				</select>
				<div class="invalid-feedback" th:errors="*{tipo}">Error</div>
			</div>
			<div th:replace="~{fragments/ui :: area('comentario', #{denunciaValoracion.comentario})}"></div>
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary" th:text="#{denunciaValoracion.save}">Guardar</button>
				<a class="btn btn-outline-secondary" th:href="@{/empresario/denuncias}" th:text="#{denunciaValoracion.atras}">Atrás</a>
			</div>
		</form>
	</div>
</div>
</body>
</html>
