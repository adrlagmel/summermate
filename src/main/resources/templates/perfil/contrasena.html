<!DOCTYPE html>
<!-- perfil/contrasena.html: cambio de contraseña (antes profile/editpassword.jsp) -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="#{master.page.profile.editPassword}">Contraseña</title>
</head>
<body>
<div layout:fragment="contenido" class="row justify-content-center">
	<div class="col-md-7 col-lg-5">
		<h1 class="mb-4" th:text="#{master.page.profile.editPassword}">Cambiar contraseña</h1>
		<form th:action="@{/perfil/contrasena}" th:object="${form}" method="post" novalidate>
			<input type="hidden" name="_method" value="put">
			<div th:replace="~{fragments/ui :: campo('oldPassword', #{fase5.contrasena.actual}, 'password')}"></div>
			<div th:replace="~{fragments/ui :: campo('password', #{register.password}, 'password')}"></div>
			<div th:replace="~{fragments/ui :: campo('verifyPassword', #{register.verify.password}, 'password')}"></div>
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-primary" th:text="#{fase5.guardar}">Guardar</button>
				<a class="btn btn-outline-secondary" th:href="@{/perfil}" th:text="#{fase5.cancelar}">Cancelar</a>
			</div>
		</form>
	</div>
</div>
</body>
</html>
