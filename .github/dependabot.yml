# Avisa con un pull request cuando hay versiones nuevas de las dependencias
# de Maven, de las acciones de GitHub y de las imágenes de Docker (Fase 7).
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
