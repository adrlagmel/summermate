<!DOCTYPE html>
<!-- admin/peticiones.html: peticiones de negocio pendientes (antes peticionNegocio/administrador/listpending.jsp) -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="#{master.page.peticionnegocio.listAll}">Peticiones</title>
</head>
<body>
<div layout:fragment="contenido">
	<h1 class="mb-3" th:text="#{master.page.peticionnegocio.listAll}">Peticiones</h1>
	<p th:if="${#lists.isEmpty(peticiones)}" class="text-body-secondary" th:text="#{fase5.vacio}">No hay peticiones pendientes.</p>
	<div class="table-responsive" th:unless="${#lists.isEmpty(peticiones)}">
		<table class="table align-middle">
			<thead>
				<tr>
					<th scope="col" th:text="#{peticionNegocio.codigo}">Código</th>
					<th scope="col" th:text="#{peticionNegocio.titulo}">Título</th>
					<th scope="col" th:text="#{peticionNegocio.empresario}">Empresario</th>
					<th scope="col" th:text="#{peticionNegocio.fecha}">Fecha</th>
					<th scope="col"><span class="visually-hidden" th:text="#{fase5.acciones}">Acciones</span></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="p : ${peticiones}">
					<td class="font-monospace" th:text="${p.codigo}">ABC</td>
					<td th:text="${p.titulo}">Título</td>
					<td th:text="|${p.empresario.nombre} ${p.empresario.apellidos}|">Empresario</td>
					<td class="text-nowrap" th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy')}">01/08/2026</td>
					<td class="text-end text-nowrap">
						<a class="btn btn-sm btn-success" th:href="@{/admin/peticiones/{id}/aceptacion(id=${p.id})}" th:text="#{peticionNegocio.accept.aceptar}">Aceptar</a>
						<a class="btn btn-sm btn-outline-danger" th:href="@{/admin/peticiones/{id}/rechazo(id=${p.id})}" th:text="#{peticionNegocio.rechazar.aceptar}">Rechazar</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
</body>
</html>
