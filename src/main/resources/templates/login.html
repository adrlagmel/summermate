<!DOCTYPE html>
<!-- login.html: acceso (antes security/login.jsp). El POST a /login lo procesa Spring Security. -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="#{security.login.title}">Acceso</title>
</head>
<body>
<div layout:fragment="contenido" class="row justify-content-center">
	<div class="col-sm-9 col-md-6 col-lg-5">
		<div class="tarjeta-cristal p-4">
			<h1 class="h3 mb-3" th:text="#{security.login.title}">Acceso</h1>

			<div th:if="${param.error}" class="alert alert-danger" role="alert" th:text="#{security.login.failed}">Usuario o contraseña incorrectos</div>
			<div th:if="${param.logout}" class="alert alert-success" role="status" th:text="#{fase5.logout.ok}">Has salido</div>

			<form th:action="@{/login}" method="post">
				<div class="mb-3">
					<label class="form-label" for="username" th:text="#{security.username}">Usuario</label>
					<input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
				</div>
				<div class="mb-3">
					<label class="form-label" for="password" th:text="#{security.password}">Contraseña</label>
					<input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
				</div>
				<button type="submit" class="btn btn-primary w-100" th:text="#{security.login}">Entrar</button>
			</form>

			<p class="mt-3 mb-0 small text-center">
				<span th:text="#{fase5.login.sincuenta}">¿No tienes cuenta?</span>
				<a th:href="@{/registro/usuario}" th:text="#{master.page.register.usuario}">Regístrate</a> ·
				<a th:href="@{/registro/empresario}" th:text="#{master.page.register.empresario}">como empresario</a>
			</p>
		</div>
	</div>
</div>
</body>
</html>
