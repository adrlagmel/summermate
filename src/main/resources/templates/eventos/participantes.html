<!DOCTYPE html>
<!-- eventos/participantes.html: inscritos en un evento (antes evento/listParticipantes.jsp) -->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
	<title th:text="#{evento.participantes}">Participantes</title>
</head>
<body>
<div layout:fragment="contenido">
	<nav aria-label="breadcrumb">
		<ol class="breadcrumb">
			<li class="breadcrumb-item"><a th:href="@{/empresario/eventos}" th:text="#{master.page.eventos.mylist}">Mis eventos</a></li>
			<li class="breadcrumb-item active" aria-current="page" th:text="${evento.nombre}">Evento</li>
		</ol>
	</nav>
	<h1 class="mb-3"><span th:text="#{evento.participantes}">Participantes</span> <span class="badge text-bg-secondary" th:text="${#lists.size(participantes)}">0</span></h1>
	<p th:if="${#lists.isEmpty(participantes)}" class="text-body-secondary" th:text="#{fase5.vacio}">Nadie todavía.</p>
	<div class="table-responsive" th:unless="${#lists.isEmpty(participantes)}">
		<table class="table">
			<thead>
				<tr>
					<th scope="col" th:text="#{usuario.nombre}">Nombre</th>
					<th scope="col" th:text="#{evento.apellidos}">Apellidos</th>
					<th scope="col" th:text="#{evento.email}">Email</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="u : ${participantes}">
					<td th:text="${u.nombre}">Ana</td>
					<td th:text="${u.apellidos}">García</td>
					<td th:text="${u.email}">ana@example.com</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
</body>
</html>
