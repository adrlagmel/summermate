# Configuración de SummerMate (Spring Boot). La conexión se lee de las
# variables de entorno DB_URL, DB_USER y DB_PASSWORD; los valores por defecto
# son los del docker-compose.yml de desarrollo.

spring:
  application:
    name: summermate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/summermate}
    username: ${DB_USER:summermate}
    password: ${DB_PASSWORD:summermate}
  jpa:
    # Las vistas recorren relaciones perezosas al pintarse (como hacía
    # OpenEntityManagerInViewInterceptor). Se deja explícito para que Spring
    # Boot no avise en cada arranque.
    open-in-view: true
    hibernate:
      # El esquema lo crea Flyway; Hibernate solo comprueba que coincide.
      ddl-auto: validate
      # Mismos nombres de tablas y columnas que antes de Spring Boot (Boot usa
      # por defecto snake_case: calendario_negocio en vez de calendarionegocio)
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    properties:
      hibernate:
        # Fase 3: carga por lotes de relaciones perezosas (evita el N+1)
        default_batch_fetch_size: 25
  flyway:
    locations: classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  mvc:
    # Permite PUT y DELETE desde formularios HTML con un campo oculto _method
    hiddenmethod:
      filter:
        enabled: true
  # Fase 6: servidor de correo (en Docker Compose, Mailpit)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      # 10 MB por el CSV de playas; las imágenes se limitan a 3 MB en ImagenService
      max-file-size: 10MB
      max-request-size: 11MB

server:
  error:
    whitelabel:
      enabled: false

logging:
  level:
    org.hibernate.orm.deprecation: error

# Fase 7: salud y métricas ------------------------------------------------------
# Actuator va en su propio puerto (8081), que no se publica a Internet: en
# Docker Compose solo escucha en 127.0.0.1. Ahí están /actuator/health (con
# /liveness y /readiness), /actuator/info y /actuator/prometheus.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false
  health:
    # Si el correo falla la aplicación sigue funcionando (los avisos solo se
    # registran): no debe marcarla como caída.
    mail:
      enabled: false

# Fase 6 ------------------------------------------------------------------------
summermate:
  # Fase 8: clave para firmar los JWT de la API del móvil (al menos 32
  # caracteres; en producción, obligatoria). Sin ella se genera una al arrancar.
  api:
    jwt-secret: ${JWT_SECRET:}
  # Fase 8: dónde se guardan las imágenes. "bd" (por defecto) las deja en la
  # base de datos; "s3" las sube a Cloudflare R2 u otro almacén compatible.
  imagenes:
    almacen: ${IMAGENES_ALMACEN:bd}
    migrar: ${IMAGENES_MIGRAR:false}
    s3:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:summermate-imagenes}
      region: ${S3_REGION:auto}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      url-publica: ${S3_URL_PUBLICA:}
  # Quién es responsable de los datos (aviso legal y política de privacidad)
  legal:
    titular: ${LEGAL_TITULAR:Summermate (Trabajo Fin de Grado, Universidad de Sevilla)}
    contacto: ${LEGAL_CONTACTO:privacidad@summermate.example}
  # Pasarela de pago de la cuenta premium: "simulada" no cobra nada
  pagos:
    pasarela: ${PAGOS_PASARELA:simulada}
  # Avisos por correo. Sin activar, los correos solo se escriben en el log.
  correo:
    activo: ${CORREO_ACTIVO:false}
    remitente: ${CORREO_REMITENTE:Summermate <no-responder@summermate.example>}
    url-base: ${URL_BASE:http://localhost:8080}

---
# Perfil de desarrollo: carga los datos de ejemplo (antes PopulateDatabase.xml)
# y desactiva la caché de plantillas. mvn spring-boot:run lo activa.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    # Los datos de ejemplo (V1000...) llevan números altos; sin esto, una base
    # de desarrollo ya creada no aplicaría las migraciones nuevas del esquema
    # (V3, V4...), que tienen un número menor.
    out-of-order: true
  thymeleaf:
    cache: false

---
# Perfil para medir el rendimiento (scripts/medir.sh): registra cada
# sentencia SQL que lanza Hibernate en target/sql.log.
spring:
  config:
    activate:
      on-profile: sql
logging:
  file:
    name: target/sql.log
  pattern:
    file: "@@SQL %m%n"
  level:
    root: warn
    org.hibernate.SQL: debug
