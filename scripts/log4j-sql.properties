# log4j-sql.properties
#
# Configuración de log para medir: escribe cada sentencia SQL que lanza
# Hibernate en target/sql.log, precedida de "@@SQL" para poder contarlas.
#
#   mvn jetty:run -Dlog4j.configuration=file:scripts/log4j-sql.properties

log4j.rootLogger = WARN, console
log4j.appender.console = org.apache.log4j.ConsoleAppender
log4j.appender.console.layout = org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern = %d{ISO8601} %-5p %c - %m%n

log4j.logger.org.hibernate.SQL = DEBUG, sql
log4j.additivity.org.hibernate.SQL = false
log4j.appender.sql = org.apache.log4j.FileAppender
log4j.appender.sql.File = target/sql.log
log4j.appender.sql.layout = org.apache.log4j.PatternLayout
log4j.appender.sql.layout.ConversionPattern = @@SQL %m%n
